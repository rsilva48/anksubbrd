name: Build iOS app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'ios/**'
      - 'proxy/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'proxy/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  proxy-check:
    name: Verify bridge on Node 24
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: proxy/.nvmrc
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - name: Install and check bridge
        working-directory: proxy
        run: |
          npm ci --ignore-scripts
          node --check server.mjs
          npm audit --omit=dev

  build:
    name: Unsigned iOS build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve app version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo 'Invalid semantic release tag'; exit 1; }
            version="${tag#v}"
          else
            tag=$(git describe --tags --exact-match --match 'v[0-9]*' HEAD 2>/dev/null || true)
            if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then version="${tag#v}"; else version=0.1.0; fi
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Show selected Xcode
        run: xcodebuild -version
      - name: Build for physical iPhone/iPad
        run: >-
          xcodebuild
          -project AirPlaySubtitlePlayer.xcodeproj
          -scheme AirPlaySubtitlePlayer
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          MARKETING_VERSION="${{ steps.version.outputs.version }}"
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package unsigned IPA for ByteLoader
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/AirPlaySubtitlePlayer.app" "$RUNNER_TEMP/ipa/Payload/AirPlaySubtitlePlayer.app"
          app="$RUNNER_TEMP/ipa/Payload/AirPlaySubtitlePlayer.app"
          plutil -lint "$app/Info.plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = '${{ steps.version.outputs.version }}'
          test -n "$executable"
          test -f "$app/$executable"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/AirPlaySubtitlePlayer-unsigned.ipa" Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AirPlaySubtitlePlayer-unsigned
          path: ${{ runner.temp }}/AirPlaySubtitlePlayer-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, proxy-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AirPlaySubtitlePlayer-unsigned
          path: release-assets
      - name: Create changelog from commits
        shell: bash
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_SHA}^" 2>/dev/null || true)
          printf '## Cambios\n\n' > release-notes.md
          if [[ -n "$previous" ]]; then
            git log --no-merges --format='- %s (`%h`)' "$previous..$GITHUB_SHA" >> release-notes.md
          else
            git log --no-merges --format='- %s (`%h`)' "$GITHUB_SHA" >> release-notes.md
          fi
          printf '\nEl IPA no está firmado; impórtalo en LiveContainer o fírmalo con tu herramienta de sideload.\n' >> release-notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-assets/AirPlaySubtitlePlayer-unsigned.ipa
          body_path: release-notes.md
          fail_on_unmatched_files: true
