name: Build AniBridge Player

on:
  workflow_dispatch:
  # Path filters are not evaluated for tag pushes; the `changes` job decides
  # what each release contains by diffing against the previous version tag.
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'ios/**'
      - 'proxy/**'
      - 'android/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
      bridge: ${{ steps.diff.outputs.bridge }}
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare with the previous version
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch) base='' ;;
            pull_request) base="$PR_BASE" ;;
            *)
              # The newest earlier version that was actually published: a tag
              # whose build failed has no release, and its changes must still
              # reach the next one.
              base=''
              for tag in $(git tag --merged "${GITHUB_SHA}^" --list 'v[0-9]*' --sort=-v:refname | head -n 20); do
                if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then base="$tag"; break; fi
              done ;;
          esac
          if [[ "$GITHUB_REF_TYPE" == tag ]] && gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-pushed tags (for example after rewriting history) keep their
            # existing release instead of rebuilding and republishing it.
            app=false; bridge=false; android=false
            printf 'Release %s already exists; nothing to publish.\n' "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT_NAME" == workflow_dispatch || -z "$base" ]]; then
            app=true; bridge=true; android=true
          else
            # Ignores manifests whose only change is the synced version number.
            result=$(node scripts/changed-components.mjs "$base" "$GITHUB_SHA")
            app=$(sed -n 's/^app=//p' <<<"$result")
            bridge=$(sed -n 's/^bridge=//p' <<<"$result")
            android=$(sed -n 's/^android=//p' <<<"$result")
          fi
          printf 'Base: %s\nApp changed: %s\nBridge changed: %s\n' "${base:-none}" "$app" "$bridge" >> "$GITHUB_STEP_SUMMARY"
          printf 'app=%s\nbridge=%s\n' "$app" "$bridge" >> "$GITHUB_OUTPUT"
          printf 'android=%s\n' "$android" >> "$GITHUB_OUTPUT"

  proxy-check:
    name: Verify bridge on Node 24
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: proxy/.nvmrc
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - name: Install, test and audit bridge
        working-directory: proxy
        run: |
          npm ci --ignore-scripts
          node --check server.mjs
          npm test
          npm audit --omit=dev

  build:
    name: Unsigned iOS build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve app version
        id: version
        shell: bash
        run: |
          # version.txt is the source of truth; a release tag must match it.
          version=$(tr -d '[:space:]' < ../version.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version.txt has an invalid version: $version"; exit 1; }
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid semantic release tag'; exit 1; }
            if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
              echo "::warning::Tag $GITHUB_REF_NAME does not match version.txt ($version); using the tag."
              version="${GITHUB_REF_NAME#v}"
            fi
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      # Uses the newest stable Xcode installed on the runner, so the app links
      # against the newest iOS/iPadOS SDK available (iOS 27 once the image
      # ships Xcode 27). Set the repository variable XCODE_VERSION (e.g. 26.6)
      # to pin a specific installed version instead.
      - name: Select Xcode
        shell: bash
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION }}
        run: |
          set -euo pipefail
          selected=''
          if [[ -n "$XCODE_VERSION" ]]; then
            selected="/Applications/Xcode_${XCODE_VERSION}.app"
            [[ -d "$selected" ]] || { echo "Xcode $XCODE_VERSION is not installed on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          else
            best_version=''
            for app in /Applications/Xcode_*.app; do
              [[ -d "$app" && ! -L "$app" ]] || continue
              name=$(basename "$app" .app)
              # Only plain version numbers: skips beta and release-candidate builds.
              [[ "$name" =~ ^Xcode_([0-9]+(\.[0-9]+)*)$ ]] || continue
              version="${BASH_REMATCH[1]}"
              if [[ -z "$best_version" || "$(printf '%s\n%s\n' "$best_version" "$version" | sort -V | tail -n 1)" == "$version" ]]; then
                best_version="$version"; selected="$app"
              fi
            done
          fi
          if [[ -n "$selected" ]]; then sudo xcode-select -s "$selected/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i 'iphoneos' || true
      - name: Build for physical iPhone/iPad
        run: >-
          xcodebuild
          -project AirPlaySubtitlePlayer.xcodeproj
          -scheme AirPlaySubtitlePlayer
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          MARKETING_VERSION="${{ steps.version.outputs.version }}"
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package unsigned IPA for LiveContainer
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/AirPlaySubtitlePlayer.app" "$RUNNER_TEMP/ipa/Payload/AirPlaySubtitlePlayer.app"
          app="$RUNNER_TEMP/ipa/Payload/AirPlaySubtitlePlayer.app"
          plutil -lint "$app/Info.plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = '${{ steps.version.outputs.version }}'
          test -n "$executable"
          test -f "$app/$executable"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/AirPlaySubtitlePlayer-unsigned.ipa" Payload
      # LiveContainer installs from an OTA manifest (itms-services) even while
      # the app itself is running inside it; see the in-app update sheet.
      - name: Create install manifest
        run: |
          app="$RUNNER_TEMP/ipa/Payload/AirPlaySubtitlePlayer.app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          version='${{ steps.version.outputs.version }}'
          ipa_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/AirPlaySubtitlePlayer-unsigned.ipa"
          cat > "$RUNNER_TEMP/manifest.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>${ipa_url}</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>${bundle_id}</string>
                  <key>bundle-version</key><string>${version}</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>AniBridge Player</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/manifest.plist"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AirPlaySubtitlePlayer-unsigned
          path: |
            ${{ runner.temp }}/AirPlaySubtitlePlayer-unsigned.ipa
            ${{ runner.temp }}/manifest.plist
          if-no-files-found: error
          retention-days: 7

  android-build:
    name: Build Android TV APK
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties
            android/gradle/libs.versions.toml
      - name: Install Android SDK
        # Since API 37, platforms are published with a minor version.
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-37.0'"
      - name: Build APK
        working-directory: android
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$(tr -d '[:space:]' < ../version.txt)" ]] || { echo 'Tag and version.txt do not match'; exit 1; }
            [[ -n "$KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]] || { echo 'Android signing secrets are required for releases'; exit 1; }
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/android-release.keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/AniBridgePlayer-TV.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/AniBridgePlayer-TV.apk"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AniBridgePlayer-TV
          path: ${{ runner.temp }}/AniBridgePlayer-TV.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish tagged release
    needs: [changes, build, proxy-check, android-build]
    # Skipped jobs count as success so bridge-only and app-only tags publish too.
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push' && github.ref_type == 'tag'
      && needs.changes.result == 'success'
      && (needs.changes.outputs.app == 'true' || needs.changes.outputs.bridge == 'true' || needs.changes.outputs.android == 'true')
      && contains(fromJSON('["success","skipped"]'), needs.build.result)
      && contains(fromJSON('["success","skipped"]'), needs.proxy-check.result)
      && contains(fromJSON('["success","skipped"]'), needs.android-build.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_APP: ${{ needs.changes.outputs.app }}
      HAS_BRIDGE: ${{ needs.changes.outputs.bridge }}
      HAS_ANDROID: ${{ needs.changes.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_APP == 'true'
        with:
          name: AirPlaySubtitlePlayer-unsigned
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_ANDROID == 'true'
        with:
          name: AniBridgePlayer-TV
          path: release-assets
      - name: Create changelog from commits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # App releases list everything since the previous release with an IPA,
          # so the in-app update sheet shows every change the user is missing.
          if [[ "$HAS_APP" == true ]]; then
            filter='select(any(.assets[]; .name == "AirPlaySubtitlePlayer-unsigned.ipa"))'
          else
            filter='.'
          fi
          previous=''
          while IFS= read -r candidate; do
            [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            if git rev-parse -q --verify "refs/tags/$candidate" >/dev/null && git merge-base --is-ancestor "refs/tags/$candidate" "${GITHUB_SHA}^"; then
              previous="$candidate"
              break
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft == false and .prerelease == false) | $filter | .tag_name")
          range="$GITHUB_SHA"
          [[ -n "$previous" ]] && range="$previous..$GITHUB_SHA"
          section() {
            local title="$1"; shift
            local lines
            lines=$(git log --no-merges --format='- %s (`%h`)' "$range" -- "$@")
            if [[ -n "$lines" ]]; then printf '### %s\n\n%s\n\n' "$title" "$lines" >> release-notes.md; fi
          }
          : > release-notes.md
          if [[ "$HAS_APP" == true ]]; then
            # GitHub strips livecontainer:// links from release notes, so the
            # install link goes through the GitHub Pages page in docs/.
            pages="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/?tag=${GITHUB_REF_NAME}"
            ipa="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/AirPlaySubtitlePlayer-unsigned.ipa"
            printf '### Instalar\n\n[Instalar con LiveContainer](%s) · [Descargar IPA](%s)\n\n' "$pages" "$ipa" >> release-notes.md
          fi
          printf '## Cambios\n\n' >> release-notes.md
          section 'App iOS' ios
          section 'Android TV' android
          section 'Bridge' proxy
          section 'Repositorio y documentación' . ':(exclude)ios' ':(exclude)android' ':(exclude)proxy'
          if [[ "$HAS_APP" == true ]]; then
            printf 'El IPA no está firmado; impórtalo en LiveContainer o fírmalo con tu herramienta de sideload.\n' >> release-notes.md
          else
            printf 'Esta release no incluye IPA y no reemplaza la última release de iOS.\n' >> release-notes.md
          fi
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Generate LiveContainer source
        if: env.HAS_APP == 'true'
        run: |
          python3 scripts/test-generate-source.py
          python3 scripts/generate-source.py \
            --ipa release-assets/AirPlaySubtitlePlayer-unsigned.ipa \
            --notes release-notes.md \
            --output release-assets/source.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"
      # Bridge-only releases are never marked latest, so
      # releases/latest/download/AirPlaySubtitlePlayer-unsigned.ipa keeps working.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          files: ${{ (env.HAS_APP == 'true' || env.HAS_ANDROID == 'true') && 'release-assets/*' || '' }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          make_latest: ${{ env.HAS_APP == 'true' && 'true' || 'false' }}
